name: Build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows stays on 6.10: since Qt 6.11 the Windows packages use a new folder layout that the installer
        # (aqtinstall 3.3.0, the newest) cannot read yet, so 6.11/6.12 fail to install there. (6.8.3 does not link
        # on current macOS SDKs: framework 'AGL' not found.) Trial: Linux and macOS on 6.12 (LTS).
        include:
          - os: windows-latest
            qt: 6.10.*
          - os: ubuntu-latest
            qt: 6.12.*
          - os: macos-latest
            qt: 6.12.*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qtmultimedia qtpdf
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/beaconview.exe dist/
          windeployqt --qmldir qml dist/beaconview.exe
          Compress-Archive dist/* BeaconView-Windows.zip
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(BeaconView VERSION ([0-9.]+)').Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=$v" installer\beaconview.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem installer-out
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/beaconview.app -qmldir=qml -dmg
          ls -la build/*.dmg
          mv build/beaconview.dmg BeaconView-macOS.dmg
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: beaconview-${{ runner.os }}
          if-no-files-found: error   # a missing package must fail the build, not pass silently
          path: |
            BeaconView-Windows.zip
            installer-out/BeaconView-Setup-*.exe
            BeaconView-macOS.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: BeaconView ${{ github.ref_name }}
          prerelease: true
          files: artifacts/*
