name: Build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/beaconview.exe dist/
          windeployqt --qmldir qml dist/beaconview.exe
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: macdeployqt build/beaconview.app -qmldir=qml -dmg
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: beaconview-${{ runner.os }}
          path: |
            dist/
            build/beaconview.dmg
